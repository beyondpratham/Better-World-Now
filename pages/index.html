<!DOCTYPE html>
<html>
  <head>

    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />

      @keyframes pulse-fade {

    <div class="flex items-center gap-3 splash-pulse">
      <div class="bwn-logo bwn-logo-lg"></div>
      <span class="text-3xl font-bold tracking-tight">BetterWorldNow</span>
    </div>

    <script>
      setTimeout(function () {
        window.location.href = "./index1.html";
