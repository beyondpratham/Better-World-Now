<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Leader Board - BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              surface: 'rgba(255, 255, 255, 0.03)',
              surfaceHover: 'rgba(255, 255, 255, 0.08)',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-up {
        animation: fadeInUp 0.5s ease-out backwards;
      }
      .fade-in-up:nth-of-type(1) { animation-delay: 0s; }
      .fade-in-up:nth-of-type(2) { animation-delay: 0.08s; }
      .fade-in-up:nth-of-type(3) { animation-delay: 0.16s; }
    </style>
  </head>
  <body class="bg-background text-white min-h-screen font-sans">
    <nav class="fixed w-full top-0 z-50 border-b border-white/5 bg-background/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="./home-after-login.html" class="flex items-center gap-2">
          <div class="bwn-logo"></div>
          <span class="text-xl font-bold tracking-tight">BetterWorldNow</span>
        </a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
          <a href="./home-after-login.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle><path stroke-linecap="round" stroke-width="2" d="M12 8h.01M11 12h1v4h1"></path></svg>About us</a>
          <a href="./desktop-12.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5.5A2.5 2.5 0 016.5 3H20v15.5A2.5 2.5 0 0117.5 21H6.5A2.5 2.5 0 014 18.5v-13z"></path><path stroke-linecap="round" stroke-width="2" d="M4 18.5A2.5 2.5 0 016.5 16H20"></path></svg>Resources</a>
          <a href="./leaderboard.html" class="text-brandGreen flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 21h8M12 17v4M17 5V3H7v2M17 5a4 4 0 01-5 4 4 4 0 01-5-4M17 5h2a2 2 0 010 4h-1M7 5H5a2 2 0 000 4h1"></path></svg>LeaderBoard</a>
          <a href="./blog.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5m-1.5-9.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>Blog</a>
        </div>
        <a href="./profile.html" class="flex items-center gap-2 text-sm border border-white/10 px-4 py-2 rounded-full hover:bg-surface transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span>My Profile</span>
        </a>
      </div>
    </nav>

    <main class="pt-40 pb-32 max-w-5xl mx-auto px-6 w-full">
      <div class="text-center mb-8 fade-in-up">
        <span class="text-brandGold text-sm tracking-widest uppercase">Check Your Ranking</span>
        <h2 class="text-4xl font-bold mt-2">Leader Board</h2>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 mb-6 fade-in-up">
        <div class="flex gap-2 glass-card p-1 rounded-full" id="periodTabs">
          <button type="button" data-period="allTime" class="period-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors">All Time</button>
          <button type="button" data-period="month" class="period-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors">This Month</button>
          <button type="button" data-period="week" class="period-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors">This Week</button>
        </div>
        <div id="regionDropdown">
          <button type="button" id="regionButton" class="glass-card px-4 py-2 text-sm font-medium flex items-center gap-2 hover:bg-surfaceHover transition-colors">
            <span id="regionLabel">All Regions</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          <div id="regionMenu" class="hidden w-40 rounded-2xl overflow-hidden py-1 border border-white/10 shadow-2xl" style="position: fixed; background-color: #16211d; z-index: 9999;">
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="all">All Regions</button>
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="North">North</button>
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="South">South</button>
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="East">East</button>
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="West">West</button>
            <button type="button" class="region-option block w-full text-left px-4 py-2 text-sm text-white hover:bg-surfaceHover transition-colors" data-region="Central">Central</button>
          </div>
        </div>
      </div>

      <div class="glass-card overflow-hidden overflow-x-auto fade-in-up">
        <div class="min-w-[640px]">
          <div class="grid grid-cols-8 gap-4 p-4 text-xs font-semibold text-gray-400 uppercase tracking-wider border-b border-white/5">
            <div>Rank</div>
            <div class="col-span-2">Name</div>
            <div>ID</div>
            <div>Points</div>
            <div>Badges</div>
            <div>Success</div>
            <div>Region</div>
          </div>
          <div id="lbRows"></div>
        </div>
      </div>
      <p id="emptyState" class="hidden text-center text-gray-500 py-10">No changemakers in this region yet.</p>
    </main>

    <script>
      var players = [
        {
          name: 'Ananya Verma', id: '00285130971', region: 'North',
          avatar: 'https://i.pravatar.cc/64?img=12', isYou: false,
          allTime: { points: 960883, badges: 7920, success: 92.04 },
          month: { points: 82044, badges: 640, success: 90.10 },
          week: { points: 21500, badges: 140, success: 88.40 },
        },
        {
          name: 'Pratham', id: '88019463581', region: 'South',
          avatar: 'https://github.com/beyondpratham.png', isYou: true,
          allTime: { points: 902037, badges: 8918, success: 87.30 },
          month: { points: 91250, badges: 710, success: 89.60 },
          week: { points: 24800, badges: 165, success: 91.20 },
        },
        {
          name: 'Rohan Mehta', id: '67255137771', region: 'West',
          avatar: 'https://i.pravatar.cc/64?img=51', isYou: false,
          allTime: { points: 871006, badges: 7840, success: 81.27 },
          month: { points: 76310, badges: 590, success: 80.90 },
          week: { points: 18200, badges: 120, success: 79.50 },
        },
        {
          name: 'Kavya Nair', id: '00116130348', region: 'East',
          avatar: 'https://i.pravatar.cc/64?img=47', isYou: false,
          allTime: { points: 620553, badges: 2003, success: 79.03 },
          month: { points: 54120, badges: 410, success: 77.80 },
          week: { points: 12900, badges: 88, success: 76.10 },
        },
        {
          name: 'Arjun Malhotra', id: '45185276601', region: 'Central',
          avatar: 'https://i.pravatar.cc/64?img=8', isYou: false,
          allTime: { points: 520972, badges: 6130, success: 71.88 },
          month: { points: 43870, badges: 350, success: 70.40 },
          week: { points: 9600, badges: 61, success: 68.90 },
        },
      ];

      var rankColors = ['text-brandGold', 'text-white', 'text-orange-400', 'text-gray-300', 'text-gray-300'];
      var selectedRegion = 'all';

      function formatNum(n) {
        return n.toLocaleString('en-IN');
      }

      function render() {
        var period = document.querySelector('.period-tab.active').dataset.period;
        var region = selectedRegion;

        var sorted = players.slice().sort(function (a, b) {
          return b[period].points - a[period].points;
        });

        var rowsHtml = '';
        var visibleCount = 0;
        sorted.forEach(function (p, idx) {
          if (region !== 'all' && p.region !== region) return;
          visibleCount++;
          var stats = p[period];
          var rowClasses = 'grid grid-cols-8 gap-4 p-4 items-center transition-colors ' +
            (p.isYou ? 'bg-brandGreen/10 border-l-2 border-brandGreen' : 'border-b border-white/5 hover:bg-surface');
          var rankColor = rankColors[idx] || 'text-gray-300';
          rowsHtml += '<div class="' + rowClasses + '">' +
            '<div class="font-bold ' + rankColor + '">#' + (idx + 1) + '</div>' +
            '<div class="col-span-2 flex items-center gap-3">' +
              '<img src="' + p.avatar + '" alt="" class="w-8 h-8 rounded-full flex-shrink-0 object-cover" />' +
              '<span class="font-medium text-white">' + p.name + (p.isYou ? ' <span class="text-xs text-brandGreen font-normal">(You)</span>' : '') + '</span>' +
            '</div>' +
            '<div class="font-mono text-gray-400 text-sm">' + p.id + '</div>' +
            '<div class="font-mono text-gray-300">' + formatNum(stats.points) + '</div>' +
            '<div class="text-gray-300">' + formatNum(stats.badges) + '</div>' +
            '<div class="text-brandGreen">' + stats.success.toFixed(2) + '%</div>' +
            '<div class="text-gray-400">' + p.region + '</div>' +
            '</div>';
        });

        document.getElementById('lbRows').innerHTML = rowsHtml;
        document.getElementById('emptyState').classList.toggle('hidden', visibleCount > 0);
      }

      function renderAnimated() {
        var rows = document.getElementById('lbRows');
        if (window.BWN && window.BWN.fadeSwap) {
          window.BWN.fadeSwap(rows, render);
        } else {
          render();
        }
      }

      var tabs = document.querySelectorAll('.period-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          tabs.forEach(function (t) {
            if (t.classList.contains('active')) {
              t.classList.add('bg-brandGreen', 'text-background');
              t.classList.remove('text-gray-300');
            } else {
              t.classList.remove('bg-brandGreen', 'text-background');
              t.classList.add('text-gray-300');
            }
          });
          renderAnimated();
        });
      });
      tabs[0].classList.add('active', 'bg-brandGreen', 'text-background');

      var regionButton = document.getElementById('regionButton');
      var regionMenu = document.getElementById('regionMenu');
      var regionLabel = document.getElementById('regionLabel');
      var regionOptions = document.querySelectorAll('.region-option');

      function positionRegionMenu() {
        var rect = regionButton.getBoundingClientRect();
        regionMenu.style.top = (rect.bottom + 8) + 'px';
        regionMenu.style.left = (rect.right - regionMenu.offsetWidth) + 'px';
      }

      regionButton.addEventListener('click', function (e) {
        e.stopPropagation();
        var opening = regionMenu.classList.contains('hidden');
        regionMenu.classList.toggle('hidden');
        if (opening) positionRegionMenu();
      });

      regionOptions.forEach(function (opt) {
        opt.addEventListener('click', function () {
          selectedRegion = opt.dataset.region;
          regionLabel.textContent = opt.textContent;
          regionMenu.classList.add('hidden');
          renderAnimated();
        });
      });

      document.addEventListener('click', function (e) {
        if (!document.getElementById('regionDropdown').contains(e.target)) {
          regionMenu.classList.add('hidden');
        }
      });

      render();
    </script>
    <script type="module" src="../js/animations.js"></script>
  </body>
</html>
