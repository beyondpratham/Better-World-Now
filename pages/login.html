<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Login - BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              surface: 'rgba(255, 255, 255, 0.03)',
              surfaceHover: 'rgba(255, 255, 255, 0.08)',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body class="bg-background text-white min-h-screen font-sans flex items-center justify-center">
    <a href="./index.html" id="betterWorldNowText" class="fixed top-8 left-8 flex items-center gap-2">
      <div class="w-6 h-8 bg-brandGreen rounded-sm"></div>
      <span class="text-xl font-bold tracking-tight">BetterWorldNow</span>
    </a>

    <div class="glass-card p-10 w-full max-w-sm">
      <h1 class="text-2xl font-bold mb-8 text-center">Login</h1>
      <form class="flex flex-col gap-4">
        <input type="text" name="username" placeholder="Enter Your Username" class="bwn-input" id="username" required />
        <input type="password" name="password" placeholder="Enter Your Password" class="bwn-input" id="password" required />
      </form>
      <button type="button" id="rectangle" class="w-full bg-brandGreen text-background font-semibold py-3 rounded-full hover:bg-emerald-400 transition-colors mt-6">
        Login
      </button>
      <button type="button" id="lOGINWITHGOOGLE" class="w-full glass-card py-3 font-medium hover:bg-surfaceHover transition-colors mt-3">
        Login with Google
      </button>
      <p class="text-center text-gray-400 text-sm mt-6">
        Don't have an account?
        <a href="./sign-up.html" id="createAccountText" class="text-brandGreen font-semibold hover:text-emerald-400">Create Account</a>
      </p>
    </div>

    <script>
      var rectangle = document.getElementById("rectangle");
      if (rectangle) {
        rectangle.addEventListener("click", function () {
          window.location.href = "./welcome.html";
        });
      }
      var lOGINWITHGOOGLE = document.getElementById("lOGINWITHGOOGLE");
      if (lOGINWITHGOOGLE) {
        lOGINWITHGOOGLE.addEventListener("click", function () {
          window.location.href = "./google-sign-in.html";
        });
      }
    </script>
  </body>
</html>
