<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Set Your Goals - BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              surface: 'rgba(255, 255, 255, 0.03)',
              surfaceHover: 'rgba(255, 255, 255, 0.08)',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body class="bg-background text-white min-h-screen font-sans">
    <nav class="fixed w-full top-0 z-50 border-b border-white/5 bg-background/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="./home-after-login.html" class="flex items-center gap-2">
          <div class="w-6 h-8 bg-brandGreen rounded-sm"></div>
          <span class="text-xl font-bold tracking-tight">BetterWorldNow</span>
        </a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
          <a href="./desktop-12.html" class="hover:text-white transition-colors">Resources</a>
          <a href="./leaderboard.html" class="hover:text-white transition-colors">LeaderBoard</a>
          <a href="./home-after-login.html" class="hover:text-white transition-colors">About us</a>
          <a href="./blog.html" class="hover:text-white transition-colors">Blog</a>
        </div>
        <a href="./profile.html" class="flex items-center gap-2 text-sm border border-white/10 px-4 py-2 rounded-full hover:bg-surface transition-all">
          <span>My Profile</span>
        </a>
      </div>
    </nav>

    <main class="pt-40 pb-32 max-w-xl mx-auto px-6">
      <h2 class="text-3xl font-bold mb-8 text-center">Set Your Goals</h2>
      <form class="glass-card p-10 flex flex-col gap-5">
        <input type="text" name="goal1" placeholder="Goal 1" class="bwn-input" id="goal1" required />
        <input type="text" name="goal2" placeholder="Goal 2" class="bwn-input" id="goal2" required />
        <input type="text" name="goal3" placeholder="Goal 3" class="bwn-input" id="goal3" required />
        <input type="text" name="goal4" placeholder="Goal 4" class="bwn-input" id="goal4" required />
        <div class="flex gap-4 mt-4">
          <button type="button" id="rectangle" class="flex-1 glass-card py-3 font-medium hover:bg-surfaceHover transition-colors">Save for Now</button>
          <button type="button" id="sUBMITText" class="flex-1 bg-brandGreen text-background font-semibold py-3 rounded-full hover:bg-emerald-400 transition-colors">Submit</button>
        </div>
      </form>
    </main>

    <script>
      var rectangle = document.getElementById("rectangle");
      if (rectangle) {
        rectangle.addEventListener("click", function () {
          window.location.href = "./profile.html";
        });
      }
      var sUBMITText = document.getElementById("sUBMITText");
      if (sUBMITText) {
        sUBMITText.addEventListener("click", function () {
          window.location.href = "./profile.html";
        });
      }
    </script>
  </body>
</html>
