<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Take A Quiz - BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              surface: 'rgba(255, 255, 255, 0.03)',
              surfaceHover: 'rgba(255, 255, 255, 0.08)',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body class="bg-background text-white min-h-screen font-sans">
    <nav class="fixed w-full top-0 z-50 border-b border-white/5 bg-background/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="./home-after-login.html" class="flex items-center gap-2">
          <div class="bwn-logo"></div>
          <span class="text-xl font-bold tracking-tight">BetterWorldNow</span>
        </a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
          <a href="./home-after-login.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle><path stroke-linecap="round" stroke-width="2" d="M12 8h.01M11 12h1v4h1"></path></svg>About us</a>
          <a href="./desktop-12.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5.5A2.5 2.5 0 016.5 3H20v15.5A2.5 2.5 0 0117.5 21H6.5A2.5 2.5 0 014 18.5v-13z"></path><path stroke-linecap="round" stroke-width="2" d="M4 18.5A2.5 2.5 0 016.5 16H20"></path></svg>Resources</a>
          <a href="./leaderboard.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 21h8M12 17v4M17 5V3H7v2M17 5a4 4 0 01-5 4 4 4 0 01-5-4M17 5h2a2 2 0 010 4h-1M7 5H5a2 2 0 000 4h1"></path></svg>LeaderBoard</a>
          <a href="./blog.html" class="hover:text-white transition-colors flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5m-1.5-9.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>Blog</a>
        </div>
        <a href="./profile.html" class="flex items-center gap-2 text-sm border border-white/10 px-4 py-2 rounded-full hover:bg-surface transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span>My Profile</span>
        </a>
      </div>
    </nav>

    <main class="pt-40 pb-32 max-w-3xl mx-auto px-6 w-full">
      <div class="flex items-center justify-center gap-3 mb-14">
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-brandGreen">✓</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full bg-brandGreen text-background font-bold flex items-center justify-center text-sm">2</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-gray-400">3</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-gray-400">4</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-gray-400">5</div>
      </div>

      <h1 class="text-2xl md:text-3xl font-bold text-center mb-4">
        Which colours in dustbins represent these functions?
      </h1>
      <p class="text-center text-gray-400 mb-12">1 &mdash; wet and biodegradable wastes &nbsp;&middot;&nbsp; 2 &mdash; dry and non-biodegradable wastes &nbsp;&middot;&nbsp; 3 &mdash; non recyclable</p>

      <div class="grid md:grid-cols-2 gap-5 mb-14">
        <button type="button" id="frameContainer0" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">A.</span>
          <span class="font-medium">1 - red&nbsp; 2 - blue&nbsp; 3 - green</span>
        </button>
        <button type="button" id="frameContainer1" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">B.</span>
          <span class="font-medium">1 - green&nbsp; 2 - blue&nbsp; 3 - red</span>
        </button>
        <button type="button" id="frameContainer2" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">C.</span>
          <span class="font-medium">1 - blue&nbsp; 2 - green&nbsp; 3 - red</span>
        </button>
        <button type="button" id="frameContainer3" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">D.</span>
          <span class="font-medium">1 - green&nbsp; 2 - red&nbsp; 3 - blue</span>
        </button>
      </div>

      <div class="flex justify-between">
        <button type="button" id="buttonStartSolving1" class="glass-card px-8 py-3 font-medium hover:bg-surfaceHover transition-colors">&larr; Go Back</button>
        <button type="button" id="buttonStartSolving" class="bg-brandGreen text-background font-semibold px-8 py-3 rounded-full hover:bg-emerald-400 transition-colors">Next &rarr;</button>
      </div>
    </main>

    <script>
      var map = {
        frameContainer0: "./wrong.html",
        frameContainer1: "./right.html",
        frameContainer2: "./wrong.html",
        frameContainer3: "./wrong.html",
      };
      Object.keys(map).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) {
          el.addEventListener("click", function () {
            window.location.href = map[id];
          });
        }
      });

      var buttonStartSolving = document.getElementById("buttonStartSolving");
      if (buttonStartSolving) {
        buttonStartSolving.addEventListener("click", function () {
          window.location.href = "./quiz3.html";
        });
      }

      var buttonStartSolving1 = document.getElementById("buttonStartSolving1");
      if (buttonStartSolving1) {
        buttonStartSolving1.addEventListener("click", function () {
          window.location.href = "./quiz1.html";
        });
      }
    </script>
    <script type="module" src="../js/animations.js"></script>
  </body>
</html>
