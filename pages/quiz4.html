<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Take A Quiz - BetterWorldNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0d1310',
              surface: 'rgba(255, 255, 255, 0.03)',
              surfaceHover: 'rgba(255, 255, 255, 0.08)',
              brandGreen: '#10B981',
              brandGold: '#FBBF24',
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body class="bg-background text-white min-h-screen font-sans">
    <nav class="fixed w-full top-0 z-50 border-b border-white/5 bg-background/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="./home-after-login.html" class="flex items-center gap-2">
          <div class="bwn-logo"></div>
          <span class="text-xl font-bold tracking-tight">BetterWorldNow</span>
        </a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
          <a href="./home-after-login.html" class="hover:text-white transition-colors">About us</a>
          <a href="./desktop-12.html" class="hover:text-white transition-colors">Resources</a>
          <a href="./leaderboard.html" class="hover:text-white transition-colors">LeaderBoard</a>
          <a href="./blog.html" class="hover:text-white transition-colors">Blog</a>
        </div>
        <a href="./profile.html" class="flex items-center gap-2 text-sm border border-white/10 px-4 py-2 rounded-full hover:bg-surface transition-all">
          <span>My Profile</span>
        </a>
      </div>
    </nav>

    <main class="pt-40 pb-32 max-w-3xl mx-auto px-6 w-full">
      <div class="flex items-center justify-center gap-3 mb-14">
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-brandGreen">✓</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-brandGreen">✓</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-brandGreen">✓</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full bg-brandGreen text-background font-bold flex items-center justify-center text-sm">4</div>
        <div class="w-16 h-px bg-white/10"></div>
        <div class="w-9 h-9 rounded-full glass-card font-bold flex items-center justify-center text-sm text-gray-400">5</div>
      </div>

      <h1 class="text-2xl md:text-3xl font-bold text-center mb-12">
        In which of the following ways do trees help the environment?
      </h1>

      <div class="grid md:grid-cols-2 gap-5 mb-14">
        <button type="button" id="frameContainer" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">A.</span>
          <span class="font-medium">Purify, oxygenate air, combat climate change</span>
        </button>
        <button type="button" id="frameContainer1" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">B.</span>
          <span class="font-medium">Provide housing to millions of species</span>
        </button>
        <button type="button" id="frameContainer2" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">C.</span>
          <span class="font-medium">Maintain water cycle</span>
        </button>
        <button type="button" id="frameContainer3" class="glass-card p-6 text-left flex items-center gap-4 hover:bg-surfaceHover hover:border-brandGreen/40 transition-all">
          <span class="font-bold text-brandGold">D.</span>
          <span class="font-medium">All of the above and more</span>
        </button>
      </div>

      <div class="flex justify-between">
        <button type="button" id="buttonStartSolving1" class="glass-card px-8 py-3 font-medium hover:bg-surfaceHover transition-colors">&larr; Go Back</button>
        <button type="button" id="buttonStartSolving" class="bg-brandGreen text-background font-semibold px-8 py-3 rounded-full hover:bg-emerald-400 transition-colors">Next &rarr;</button>
      </div>
    </main>

    <script>
      var map = {
        frameContainer: "./right.html",
        frameContainer1: "./right.html",
        frameContainer2: "./right.html",
        frameContainer3: "./right.html",
      };
      Object.keys(map).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) {
          el.addEventListener("click", function () {
            window.location.href = map[id];
          });
        }
      });

      var buttonStartSolving = document.getElementById("buttonStartSolving");
      if (buttonStartSolving) {
        buttonStartSolving.addEventListener("click", function () {
          window.location.href = "./quiz5.html";
        });
      }

      var buttonStartSolving1 = document.getElementById("buttonStartSolving1");
      if (buttonStartSolving1) {
        buttonStartSolving1.addEventListener("click", function () {
          window.location.href = "./quiz3.html";
        });
      }
    </script>
  </body>
</html>
