    <script>
      var ICONS = {
        climate:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9a3 3 0 00-3 3v4.354a4 4 0 106 0V12a3 3 0 00-3-3z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v9"></path>',
        ocean:

        forest:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L6 11h3l-5 8h16l-5-8h3L12 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19v3"></path>',
        wildlife:
          '<circle cx="12" cy="15" r="3.2" stroke-width="2"></circle><circle cx="6.5" cy="9" r="1.5" stroke-width="2"></circle><circle cx="10.5" cy="6" r="1.5" stroke-width="2"></circle><circle cx="13.5" cy="6" r="1.5" stroke-width="2"></circle><circle cx="17.5" cy="9" r="1.5" stroke-width="2"></circle>',
        energy:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"></path>',
        waste:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7h12M9 7V4h6v3m-7 0l.8 12.2a2 2 0 002 1.8h4.4a2 2 0 002-1.8L17 7"></path>',
        water:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3s6 6.5 6 11a6 6 0 11-12 0c0-4.5 6-11 6-11z"></path>',
        air:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h10.5a2.25 2.25 0 10-2.25-2.25"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16h12.5a2.25 2.25 0 112.25 2.25"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h7.5"></path>',
        food:
          '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8C8 10 6 16 4 21c2-1 4-1 6 0 6-1 9-5 9-11 0-2-1-2-2-2z"></path>',
      };

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i];
          a[i] = a[j];
          a[j] = tmp;
        }
        return a;
      }

      var order = shuffle(FACTS.map(function (_, i) { return i; }));
      var pos = 0;

      var iconWrap = document.getElementById('factIconWrap');
      var categoryEl = document.getElementById('factCategory');
      var titleEl = document.getElementById('factTitle');
      var textEl = document.getElementById('factText');
      var counterEl = document.getElementById('factCounter');
      var backBtn = document.getElementById('factBackBtn');
      var nextBtn = document.getElementById('factNextBtn');

      function render() {
        var fact = FACTS[order[pos]];
        iconWrap.innerHTML = '<svg class="w-7 h-7 text-brandGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + (ICONS[fact.category] || ICONS.climate) + '</svg>';
        categoryEl.textContent = fact.category;
        titleEl.textContent = fact.title;
        textEl.textContent = fact.text;
        counterEl.textContent = (pos + 1) + ' / ' + order.length;
        backBtn.disabled = pos === 0;
        backBtn.classList.toggle('opacity-40', pos === 0);
        backBtn.classList.toggle('cursor-not-allowed', pos === 0);
      }

      nextBtn.addEventListener('click', function () {
        pos = (pos + 1) % order.length;
        render();
      });
      backBtn.addEventListener('click', function () {
        if (pos === 0) return;
        pos--;
        render();
      });

      render();
    </script>
